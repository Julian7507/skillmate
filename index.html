<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Mate – Biết mình cần gì. Biết bắt đầu từ đâu.</title>
<style>
:root{--pb:#425B9A;--sky:#76C0EC;--cream:#FFF6DC;--pink:#FF95A5;--mentor:#C2415A;--bg:#fff;--tx:#1f2937;--mu:#5b6475;--bd:#e5e8f0;--card:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fb{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;margin-top:14px}.lf,.rt{position:sticky;top:78px}.lf a,.rt a{font-weight:600}@media(max-width:900px){.fb{grid-template-columns:1fr}.lf,.rt{display:none}}.av.s{background:var(--sky);color:#0d2a4a}.av.sm{width:28px;height:28px;font-size:13px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--pb);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.w{max-width:1180px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
.hd{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1040px;margin:auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pb);font-size:20px;cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{padding:8px 12px;border-radius:8px;color:var(--tx);font-weight:600;font-size:15px}nav a:hover,nav a.on{background:var(--cream);text-decoration:none}
.sp{flex:1}input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
.hd input{max-width:300px}label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.b{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:600 15px inherit;font-family:inherit;background:var(--pb);color:#fff;cursor:pointer;min-height:44px}
.b:hover{filter:brightness(1.1);text-decoration:none}.b.s{background:var(--bg);color:var(--pb);border:1.5px solid var(--pb)}.b.p{background:var(--pink);color:#3a1020}.b:disabled{opacity:.5;cursor:not-allowed}.b.sm{padding:6px 12px;min-height:36px;font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}.c.cr{background:var(--bg);border-left:4px solid var(--sky)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:.3em 0;color:var(--pb)}h2{font-size:24px;margin:1.4em 0 .4em}h3{margin:.2em 0}
.mu{color:var(--mu);font-size:14px}.tag{display:inline-block;background:var(--cream);border-radius:20px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0;color:var(--tx)}
.mn{color:var(--mentor);font-weight:700}.st{color:var(--pb);font-weight:700}
.bd{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}.bd.m{background:var(--pink);color:#3a1020}.bd.s{background:var(--sky);color:#0d2a4a}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pb)}
.ch{display:inline-block;border:1.5px solid var(--bd);border-radius:22px;padding:8px 14px;margin:4px;cursor:pointer;background:var(--bg);color:var(--tx);font:inherit}.ch.on{background:var(--pb);color:#fff;border-color:var(--pb)}
.hero{padding:48px 0 24px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center}
.demo{background:var(--bg);color:var(--mu);border-bottom:1px solid var(--bd);text-align:center;font-size:13px;padding:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.tk input[type=checkbox]{width:24px;height:24px;margin-top:2px;flex:none}
.done{text-decoration:line-through;color:var(--mu)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pb);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:20}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:15;padding:14px}.md{background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.av{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#3a1020;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;vertical-align:middle;margin-right:8px}.er{color:#b3261e;font-size:14px}footer{background:var(--bg);border-top:1px solid var(--bd);margin-top:48px;padding:24px 0;font-size:14px}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:80%}.msg.me{background:var(--pb);color:#fff;margin-left:auto}.msg.th{background:var(--cream)}
.av{object-fit:cover;border:2px solid var(--pink);background:#fff}.av.s{border-color:var(--sky)}
body.in{padding-left:240px}body.in.col{padding-left:72px}
.sb{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--bg);border-right:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:10px;z-index:6;overflow-y:auto}.sb.col{width:72px}.sb.col .tx{display:none}
.sb nav{display:flex;flex-direction:column;gap:2px;flex:1}.sb nav a{display:flex;gap:10px;padding:10px;border-radius:10px;color:var(--tx);font-weight:600;align-items:center}.sb nav a:hover{background:#f0f2f5;text-decoration:none}.sb nav a.on{background:#e9eef9;color:var(--pb)}
.sbh{display:flex;justify-content:space-between;align-items:center;gap:6px}.sbu{border-top:1px solid var(--bd);padding-top:10px;display:flex;flex-direction:column;gap:8px}
@media(max-width:700px){.sb{width:72px}.sb .tx{display:none}body.in,body.in.col{padding-left:72px}}
.ab{display:flex;justify-content:space-between;border-top:1px solid var(--bd);margin-top:8px;padding-top:6px;gap:6px;flex-wrap:wrap}.ab button{background:none;border:0;padding:8px 12px;border-radius:8px;font:600 14px inherit;font-family:inherit;color:var(--mu);cursor:pointer;min-height:40px}.ab button:hover{background:#f0f2f5}.ab .on{color:var(--pb)}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:10px;overflow:hidden;margin-top:10px}.gl img{width:100%;object-fit:cover;display:block;height:170px}.gl img:first-child{grid-column:1/-1;height:300px}
.stats{font-size:14px;color:var(--mu);margin-top:10px}.post h3{margin:10px 0 4px}
.av{width:56px;height:56px}.av.sm{width:40px;height:40px}.av.xl{width:168px;height:168px;border:5px solid #fff;box-shadow:0 0 0 2px var(--pink);margin:0}.av.s.xl{box-shadow:0 0 0 2px var(--sky)}
.cov{height:190px;background:#dcecf8;border-radius:0 0 14px 14px;margin:0 -18px}.ph{display:flex;align-items:flex-end;gap:18px;margin:-84px 0 12px 24px;flex-wrap:wrap}.ph h1{font-size:30px}
.ab button{font-size:16px;padding:10px 18px;min-height:52px;display:inline-flex;align-items:center;gap:10px}.ab .on{background:#e9eef9}.ic{width:30px;height:30px}.ni{width:34px;height:34px;flex:none}.stats{font-size:15px}
.sb.col nav a{justify-content:center}
.ic{filter:grayscale(1) opacity(.6);transition:filter .15s}.ab button:hover .ic{filter:grayscale(.4) opacity(.85)}.ab .on .ic{filter:none}.ab .n{font-weight:700;font-size:17px}.ab .on .n{color:var(--pb)}
.tabb{background:none;border:0;padding:12px 18px;font:600 16px inherit;font-family:inherit;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent}.tabb.on{color:var(--pb);border-color:var(--pb)}
.gl img:first-child{height:auto;max-height:440px}.evs{margin:0 0 18px}.evs img{width:100%;border-radius:10px;display:block}.evt{display:block;font-weight:800;font-size:18px;color:var(--tx);margin:8px 0 4px;line-height:1.3}.evm{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}.av.xs{width:22px;height:22px;margin:0;border-width:1px}
.lv{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}@media(max-width:1000px){.lv{grid-template-columns:1fr}}.scr{position:relative;aspect-ratio:16/9;background:#0c0f1a;border-radius:12px;overflow:hidden}.scr img.bg{width:100%;height:100%;object-fit:cover;display:block}.scr .tp{position:absolute;top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap}.scr .pill{background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:4px 10px;font-weight:700;font-size:14px}.scr .lv-red{background:#e11d48}.scr .bt{position:absolute;left:0;right:0;bottom:0;padding:14px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;gap:10px}.scr .bt .av{margin:0}
.scr .bt{gap:12px;padding:12px 14px}.pp{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:16px;cursor:pointer;flex:none}.trk{flex:1;height:5px;background:rgba(255,255,255,.35);border-radius:3px}.trk i{display:block;height:100%;background:#e11d48;border-radius:3px;position:relative}.trk i:after{content:"";position:absolute;right:-6px;top:-4px;width:13px;height:13px;border-radius:50%;background:#e11d48}.lt{font-size:13px;font-weight:700;white-space:nowrap}.gl2{background:#e11d48;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer;white-space:nowrap}.pov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;font-size:20px;font-weight:700;cursor:pointer;text-align:center;padding:10px}
</style></head><body>

b.tg.forEach(t=>{if(goal.includes(t.split(" ")[0])){s+=3;w.push("gần mục tiêu “"+o[2]+"”")}if(sk.some(k=>k.includes(t)||t.includes(k))){s+=2;w.push("liên quan kỹ năng "+t)}});
return[s,[...new Set(w)].join("; ")||"nội dung mới để khám phá"]}

const PH={b1:[['Giai đoạn 1: Xây nền tảng gốc (Tháng 1–2)','Nắm chắc phát âm IPA, ngữ pháp căn bản và khoảng 1.000–1.500 từ vựng cốt lõi.',['Phát âm: học bảng IPA qua kênh YouTube English Speakeasy hoặc Rachel’s English.','Ngữ pháp: ôn 12 thì, câu bị động, câu điều kiện, mệnh đề quan hệ; dùng giáo trình miễn phí của trường hoặc bản có bản quyền hợp lệ.','Từ vựng: 10–15 từ mỗi ngày bằng Quizlet hoặc Anki, học theo chủ đề quen thuộc.']],['Giai đoạn 2: Phát triển 4 kỹ năng cơ bản (Tháng 3–5)','Làm quen mặt chữ, nghe hiểu hội thoại ngắn, viết được câu và đoạn văn ngắn.',['Nghe: BBC Learning English, VOA Learning English hoặc podcast tốc độ 0.75x–1x.','Đọc: bài ngắn trên News in Levels, đi từ cấp dễ đến trung bình.','Viết và nói: nhật ký 3–5 câu mỗi ngày; shadowing theo video người bản xứ để luyện ngữ điệu.']],['Giai đoạn 3: Chuyên sâu định dạng B2 (Tháng 6–7)','Làm quen cấu trúc bài thi VSTEP B2, nâng vốn từ lên 3.000–4.000.',['Nghe (40 phút): hội thoại dài và thông báo công cộng.','Đọc (60 phút): skimming lấy ý chính, scanning tìm thông tin cụ thể.','Viết (60 phút): email trang trọng khoảng 120 từ, bài luận khoảng 250 từ.','Nói (12 phút): ba phần tương tác xã hội, thảo luận giải pháp, phát triển chủ đề.']],['Giai đoạn 4: Luyện đề và thực chiến (Tháng 8–9)','Quen áp lực thời gian và tối ưu điểm số.',['Tải đề thi thử miễn phí từ nguồn chia sẻ đáng tin cậy.','Bấm giờ như thi thật: Nghe 40 phút, Đọc 60 phút, Viết 60 phút, Nói ghi âm.','Rà lỗi sai; có thể dùng công cụ AI miễn phí để sửa bài viết và bài nói, nhưng hãy tự kiểm tra lại.']],['Giai đoạn 5: Duy trì và thi thật (Tháng 10–12)','Giữ nhịp học và đăng ký thi khi điểm thi thử ổn định.',['Thi thử mỗi 2 tuần, ghi lại điểm từng kỹ năng.','Tập trung kỹ năng yếu nhất; mỗi ngày vẫn giữ 10 phút shadowing.']]],b2:[['Giai đoạn 1: Nền tảng (Tuần 1)','Thao tác nhanh và hiểu dữ liệu dạng bảng.',['Học 10 phím tắt hay dùng và Ctrl+T.','Làm sạch dữ liệu: dòng trùng, ngày sai định dạng, ô trống.']],['Giai đoạn 2: Phân tích (Tuần 2–3)','Trả lời câu hỏi kinh doanh bằng số liệu.',['PivotTable và Slicer.','SUMIFS, XLOOKUP, INDEX-MATCH.']],['Giai đoạn 3: Trình bày (Tuần 4)','Biến số liệu thành thông điệp.',['Dashboard một trang, mỗi biểu đồ trả lời một câu hỏi.','Viết 3 dòng kết luận và đề xuất.']]],b3:[['Giai đoạn 1: Khái niệm (Ngày 1–2)','Hiểu HTTT và mô hình dữ liệu.',['Đọc chương mở đầu giáo trình của trường.','Vẽ ERD cho một cửa hàng nhỏ.']],['Giai đoạn 2: SQL cơ bản (Ngày 3)','Truy vấn được dữ liệu.',['SELECT, WHERE, JOIN trên SQLBolt.']],['Giai đoạn 3: Quy trình và dự án (Ngày 4–5)','Gom kiến thức thành sản phẩm.',['Vẽ quy trình nghiệp vụ.','Mini project 2 trang: ERD, quy trình, 3 câu SQL.']]],b4:[['Giai đoạn 1: Chuẩn bị (Ngày 1–2)','Có dàn ý và slide gọn.',['Dàn ý: vấn đề, lý do quan trọng, ba ý chính, kêu gọi hành động.','Slide ít chữ, một ý mỗi slide.']],['Giai đoạn 2: Luyện nói (Ngày 3–4)','Nói rõ, đúng nhịp.',['Luyện thành tiếng 3 lần.','Quay video 3 phút và ghi 3 điểm cần sửa.']],['Giai đoạn 3: Phản hồi (Ngày 5)','Điều chỉnh theo góp ý.',['Nhờ một người bạn nhận xét theo 3 câu hỏi.']]]};

const BI={"b1": "time", "b2": "excel", "b3": "team", "b4": "pres"};
function gal(id){const k=BI[id];return k?`<div class="gl"><img src="${IMG[k]}" alt="Ảnh minh họa bài viết"></div>`:''}
function abar(id){const c=cnt(id),l=(S.lk||[]).includes(id),sv=S.saved.includes(id),rp=S.rep.some(x=>x.id===id),ps=S.proj.some(p=>p.blog===id),rs=Math.round(ST[id][1]*0.6)+(ps?1:0),ib=(k,n)=>`<img class="ic" alt="" src="${ICN[k]}"><span class="n">${n}</span>`;
return`<div class="ab"><div><button class="${l?'on':''}" aria-label="Thích (${c.l})" title="Thích" onclick="likeB('${id}')">${ib('like',c.l)}</button><button aria-label="Bình luận (${c.c})" title="Bình luận" onclick="go('blog-${id}');setTimeout(()=>{const e=document.getElementById('cm');e&&e.focus()},60)">${ib('comment',c.c)}</button><button class="${rp?'on':''}" aria-label="Chia sẻ lại (${c.r})" title="${rp?'Bỏ chia sẻ lại':'Chia sẻ lại'}" onclick="${rp?`unrepost('${id}')`:`repostM('${id}')`}">${ib('share',c.r)}</button></div><div><button class="${sv?'on':''}" aria-label="Lưu bài viết (${c.s})" title="Lưu bài viết" onclick="saveBlog('${id}')">${ib('savep',c.s)}</button><button class="${ps?'on':''}" aria-label="Lưu lộ trình (${rs})" title="${ps?'Mở lộ trình đã lưu':'Lưu lộ trình'}" onclick="roadmap('${id}')">${ib('saver',rs)}</button></div></div>`}
function stats(id){return''}
function head(id){const b=B[id],m=M[b.m];return`<div class="row" style="flex-wrap:nowrap">${AV(m.n)}<div><a class="mn" href="#mentor-${b.m}">${esc(m.n)}</a><span class="bd m">MENTOR</span><div class="mu">${esc(m.r)} · Chia sẻ lộ trình</div></div></div>`}
function card(id,why){const b=B[id];return`<article class="c post">${head(id)}<h3><a href="#blog-${id}">${esc(b.t)}</a></h3><p>${esc(b.sum)}</p><p class="mu">Thời gian: ${esc(b.dur)} · Chi phí: ${esc(b.cost)}</p>${b.tg.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${why?`<p class="mu">Gợi ý vì: ${esc(why)}</p>`:''}${gal(id)}${stats(id)}${abar(id)}</article>`}
function blogBody(id){const b=B[id],cm=S.cm[id]||[];
return`${head(id)}<h2 style="margin:10px 0 4px">${esc(b.t)}</h2><p>${esc(b.sum)}</p><p class="mu">Đối tượng: ${esc(b.aud)}<br>Thời gian: ${esc(b.dur)} · Chi phí: ${esc(b.cost)}</p>${phases(id)}
<div class="c"><h3>Tuần khởi động: nhiệm vụ theo ngày</h3>${b.tk.map((t,i)=>`<div class="tk"><div><b>${esc(t[1])}: ${esc(t[0])}</b><div class="mu">${t[2]} phút · Lưu ý tài liệu: ${esc(t[3]||'mentor chưa nêu')}</div><p style="margin:6px 0">${esc((RES[id].d[i]||[])[0]||'')}</p><div>${lks((RES[id].d[i]||[])[1])}</div></div></div>`).join('')}</div>
<div class="c"><h3>Lưu ý cho cả lộ trình</h3><ul>${RES[id].tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Tài liệu miễn phí</h3>${lks(RES[id].free)}</div>${gal(id)}${stats(id)}${abar(id)}
<h3 style="margin-top:16px">Bình luận</h3>${seedCm(id)}${cm.map(c=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap;margin:10px 0">${AV(c.u,'s sm')}<div style="background:#f0f2f5;border-radius:14px;padding:8px 12px"><b class="st">${esc(c.u)}</b><span class="bd s">STUDENT</span><div>${esc(c.t)}</div></div></div>`).join('')}
<div class="row" style="flex-wrap:nowrap;margin-top:10px">${AV(S.user.name,'s sm')}<input id="cm" aria-label="Bình luận" placeholder="Viết bình luận..." onkeydown="if(event.key==='Enter')addCm('${id}')"><button class="b sm" onclick="addCm('${id}')">Gửi</button></div><p class="mu"><a onclick="reportM()" href="#blog-${id}">Báo cáo bài viết</a></p>`}
function postModal(id){const m=M[B[id].m];return`<div class="ov" onclick="if(event.target===this)go('feed')"><div class="md" style="max-width:780px;padding:0" role="dialog" aria-modal="true"><div style="position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 56px;text-align:center;font-weight:800">Bài viết của ${esc(m.n)}<button class="b s sm" style="position:absolute;right:10px;top:8px" aria-label="Đóng" onclick="go('feed')">✕</button></div><div style="padding:16px">${blogBody(id)}</div></div></div>`}
function hdr(){const u=S.in&&S.user;if(!u){$('#hd').className='';document.body.classList.remove('col');hdrOld();return}
const cur=window.CUR||'feed',col=!!S.col,it=[['feed','🏠','Feed'],['projects','🧭','Lộ trình của tôi'],['messages','💬','Chat'],['events','📅','Sự kiện'],['me','👤','Hồ sơ']];
document.body.classList.toggle('col',col);$('#hd').className='sb'+(col?' col':'');
$('#hd').innerHTML=`<div class="sbh"><div class="logo" onclick="go('feed')" tabindex="0" role="link">${LOGO}<span class="tx">Skill Mate</span></div><button class="b s sm" aria-label="Thu gọn hoặc mở rộng thanh bên" onclick="S.col=!S.col;save();hdr()">${col?'»':'«'}</button></div><input class="tx" aria-label="Tìm kiếm" placeholder="Tìm kiếm..." value="${esc(Q)}" onkeydown="if(event.key==='Enter'){Q=this.value;go('search')}"><nav>${it.map(i=>`<a href="#${i[0]}" title="${i[2]}" class="${cur===i[0]||(i[0]==='projects'&&(cur==='project'||cur==='test'))?'on':''}"><img class="ni" alt="" src="${NV[i[0]]}"><span class="tx">${i[2]}</span></a>`).join('')}</nav><div class="sbu"><a href="#me" class="row" style="flex-wrap:nowrap;gap:0">${AV(u.name,'s')}<span class="tx"><b class="st">${esc(u.name)}</b><br><span class="bd s" style="margin:0">STUDENT</span></span></a><button class="b s sm" onclick="logout()" title="Đăng xuất">⎋<span class="tx"> Đăng xuất</span></button></div>`}

function attach(inp){const f=inp.files[0];inp.value='';if(!f)return;if(!/\.(pdf|docx?|xlsx?|pptx?|csv|txt|png|jpe?g)$/i.test(f.name))return toast('Chỉ hỗ trợ tệp PDF, Word, Excel, PowerPoint, CSV, TXT hoặc ảnh');if(f.size>10*1048576)return toast('Tệp quá lớn, tối đa 10 MB');const k=chatWith;FILES[f.name]=URL.createObjectURL(f);(S.msgs[k]=S.msgs[k]||[]).push({f:'me',file:{name:f.name,size:f.size},ts:nowTs()});save();render();if(SD[k])setTimeout(()=>{(S.msgs[k]=S.msgs[k]||[]).push(tM('Cảm ơn bạn nhiều nha, mình nhận được tệp rồi! 🙏',nowTs()));save();if(location.hash==='#messages'&&chatWith===k)render()},1500)}
function messages(){const ids=[...Object.keys(M),...Object.keys(SD)],mt=k=>!!M[k],nm=k=>mt(k)?M[k].n:SD[k],l=lstMsgs(chatWith),pv=k=>{const a=lstMsgs(k).slice(-1)[0];return a?(a.file?'Tệp: '+a.file.name:(a.f==='me'?'Bạn: ':'')+a.t):'Chưa có tin nhắn'};
const bub=(x,i)=>{const o=x.f==='me',sep=x.ts&&(i===0||l[i-1].ts!==x.ts)?`<div class="mu" style="text-align:center;font-size:12px;margin:12px 0 4px">${esc(x.ts)}</div>`:'',body=x.file?`<div style="background:#fff;color:var(--tx);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center"><img src="${AT.doc}" alt="" style="width:38px;height:38px;flex:none"><div style="min-width:0"><b style="word-break:break-all">${esc(x.file.name)}</b><div class="mu" style="font-size:12px">${fsz(x.file.size||GEN[x.file.gen]().length)}</div></div><button class="b s sm" onclick="dlMsg(${i})">Tải xuống</button></div>`:esc(x.t);

function badges(id){const s=MS[id],rc=Object.keys(B).filter(k=>B[k].m===id).length;const L=[['🗺️','Roadmap Creator','Đăng từ 2 lộ trình',rc,2],['🎙️','Live Speaker','Tổ chức từ 3 buổi livestream',s.live,3],['🤝','Mentor Contributor','Hỗ trợ từ 50 sinh viên',s.help,50],['🌱','Community Builder','Trả lời từ 50 câu hỏi',s.reply,50],['🎓','Coaching Mentor','Hoàn thành 1 chương trình coaching',s.coach,1]];L.push(['⭐','Outstanding Mentor','Đạt đủ 5 huy hiệu trên',L.filter(x=>x[3]>=x[4]).length,5]);return L}
function badgeCard(x){const ok=x[3]>=x[4];return`<div class="c" style="text-align:center;${ok?'border:2px solid var(--pink)':''}"><div style="font-size:40px;${ok?'':'filter:grayscale(1);opacity:.5'}">${x[0]}</div><b>${x[1]}</b><div class="mu">${x[2]}</div>${ok?'<span class="bd m" style="display:inline-block;margin:8px 0 0">ĐÃ ĐẠT</span>':`<div style="margin-top:8px">${bar(Math.round(x[3]*100/x[4]))}</div><div class="mu">${x[3]}/${x[4]}</div>`}</div>`}

return`<div class="cov"></div><div class="ph">${AV(m.n,'xl')}<div><h1 class="mn" style="margin:0">${esc(m.n)}</h1><span class="bd m" style="margin:0">MENTOR</span><div class="mu" style="margin-top:4px">${esc(m.r)} · ${esc(cur[0])} từ ${cur[2]}</div><div style="font-size:22px" title="Huy hiệu đã đạt">${got.map(x=>`<span title="${x[1]}">${x[0]}</span>`).join(' ')||'<span class="mu" style="font-size:14px">Chưa có huy hiệu</span>'}</div></div></div><p><a class="b" href="#messages" onclick="chatWith='${id}'">Nhắn tin</a></p><div style="border-bottom:1px solid var(--bd);margin-bottom:12px">${[['about','Giới thiệu'],['posts','Bài viết ('+bl.length+')'],['ach','Thành tựu ('+got.length+')']].map(t=>`<button class="tabb ${mtab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>${body}`}
